crons:
  - name: daily-enquiry-summary
    description: "Emails the owner a summary of new student enquiries every morning at 8am IST"
    cron: "0 8 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-summary"
    method: POST
    enabled: true
